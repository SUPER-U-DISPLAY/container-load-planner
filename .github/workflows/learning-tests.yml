name: Learning planner tests
on:
  push:
    paths: ['v3/**', 'server/**', 'scripts/**', 'package*.json', '.github/workflows/learning-tests.yml']
  pull_request:
    paths: ['v3/**', 'server/**', 'scripts/**', 'package*.json', '.github/workflows/learning-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: planner_test
          POSTGRES_PASSWORD: planner_test
          POSTGRES_DB: planner_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U planner_test -d planner_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          PLANNER_TEST_DATABASE_URL: postgresql://planner_test:planner_test@127.0.0.1:5432/planner_test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
