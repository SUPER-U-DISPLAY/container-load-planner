<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER U · 3D 叠箱组合</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="stack.css?v=2.2.0"></head><body>
<header id="stackHeader"><div><strong>SUPER U · 3D 叠箱组合</strong><small id="projectTitle"></small></div><div class="stack-actions"><span id="saveStatus">自动保存</span><button class="btn" id="projectTools">项目 / 规则</button><button class="btn" id="demo3d">试用叠箱示例</button><button class="btn primary" id="backResults">返回排柜 →</button></div></header>
<div class="stack-guide"><b>从左侧拖一只箱子到工作台，再拖上箱到箱顶。</b><span>左键拖箱子 · 右键转视角 · 滚轮缩放 · Shift + 右键平移</span></div>
<main id="stackLayout">
<section class="stack-panel catalog"><div class="stack-panel-head"><h2>全部产品模型 <small id="catalogCount"></small></h2><input id="modelSearch" placeholder="搜索品名 / 箱号" aria-label="搜索产品模型"></div><div class="catalog-help">每种包装一个模型，标注剩余箱数。拖出一只才占用数量；缩略图分别缩放，工作台按实际尺寸显示。</div><div id="catalogModels" class="model-grid"></div></section>
<section class="stack-panel workarea"><div class="workarea-toolbar"><input id="stackName" value="组合 1" aria-label="组合名称"><span class="stack-tag" id="draftState">未保存</span><div class="stack-actions"><button class="btn sm" id="newStack">＋ 新组合</button><button class="btn sm" id="undo3d" disabled>撤销</button><button class="btn sm" id="clear3d">清空</button></div></div>
<div class="scene-toolbar"><div class="stack-actions"><button class="btn xs" data-scene-view="iso">立体</button><button class="btn xs" data-scene-view="top">俯视</button><button class="btn xs" data-scene-view="front">侧视</button><button class="btn xs" id="fitScene">适合窗口</button></div><label><input id="snap3d" type="checkbox" checked>自动吸附</label></div>
<div id="sceneWrap"><canvas id="stack3dCanvas" tabindex="0" aria-label="3D 叠箱工作台，左键拖动箱子，右键旋转视角，滚轮缩放"></canvas><div id="sceneLabels"></div><div id="sceneEmpty">从左侧拖入第一只底箱<br><small>再把另一只箱子拖到箱顶，就能叠放</small></div><div id="dragFeedback" role="status">尚未加入箱子</div><span id="renderMode"></span></div>
<div class="selection-toolbar"><span id="selected3d">点击模型选择箱子</span><div class="stack-actions"><button class="btn sm" id="rotate3d" disabled>水平转 90°</button><button class="btn sm" id="flip3d" disabled>换一个朝向</button><button class="btn sm danger" id="remove3d" disabled>移除此箱</button></div></div>
<div id="currentMembers"></div><div id="check3d" role="status"></div>
<div class="save-stack-bar"><label><input type="checkbox" id="rotateGroup3d" checked>排柜时允许整组水平转向</label><span id="stackSize">0 箱</span><button class="btn primary" id="saveStack3d" disabled>保存组合</button></div>
<details id="precise3d"><summary>精确调整 / 特殊摆放</summary><div class="precise-fields"><label>长向 X / mm<input id="coordX" type="number" min="0" step="10"></label><label>宽向 Y / mm<input id="coordY" type="number" min="0" step="10"></label><label>离地高度 / mm<input id="coordZ" type="number" min="0" step="10"></label><button class="btn sm" id="applyCoords">应用坐标</button></div><p>只能保存符合当前规则的组合。拖动下方支撑箱会检查上箱是否悬空；需要整体移动时，保存成组后交给排柜。</p></details>
</section>
<aside class="stack-panel saved-stacks"><div class="stack-panel-head"><h2>已保存组合 <small id="savedCount"></small></h2><p>排柜时保留组内位置和方向。</p></div><div id="savedGroups"></div><div class="saved-bottom"><button class="btn sm" id="autoStack3d">自动组合同底面散箱</button><p>未分组的箱子仍会参加自动排柜。</p></div></aside>
</main>
<div id="stackToast" role="status" aria-live="polite"></div><dialog id="stackDialog"><div id="stackDialogContent"></div></dialog><input type="file" id="stackProjectFile" accept=".json" hidden>
<script src="../js/vendor/three.min.js"></script><script src="../js/vendor/OrbitControls.js"></script><script src="renderer.js?v=2.2.0"></script><script src="core.js?v=2.2.0"></script><script src="stacking.js?v=2.2.0"></script><script src="drawing.js?v=2.2.0"></script><script src="bridge.js?v=2.2.0"></script><script src="scene-math.js?v=2.2.0"></script><script src="scene3d.js?v=2.2.0"></script><script src="stack-app.js?v=2.2.0"></script>
</body></html>
