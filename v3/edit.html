<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER U · 调整排柜</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="stack.css?v=3.3.0"><link rel="stylesheet" href="learning.css?v=3.3.0"><link rel="stylesheet" href="edit.css?v=3.3.0"></head><body class="learning-page">
<header class="learning-header"><strong>SUPER U · 调整排柜</strong><span id="editTitle" class="learning-help"></span><div class="learning-actions"><button class="btn" id="undoLayout">撤销</button><button class="btn" id="repackUnlocked">只重排未锁定货物</button><button class="btn" id="exitEditor">去排柜</button><button class="btn primary" id="saveLayout">保存调整并去排柜</button></div></header>
<main id="packingEditor"><aside class="edit-sidebar"><label>当前集装箱<select id="editContainer"></select></label><button class="btn sm" id="addContainer">增加一个柜</button><p id="editCounts" class="learning-help"></p><h3>柜内货物</h3><div id="editObjects"></div><h3>未装入</h3><div id="heldObjects"></div></aside>
<section class="edit-workarea"><div class="scene-toolbar"><div class="learning-actions"><button class="btn xs" data-scene-view="iso">立体</button><button class="btn xs" data-scene-view="top">俯视</button><button class="btn xs" data-scene-view="front">侧视</button><button class="btn xs" id="fitScene">适合窗口</button></div><label><input id="snapLayout" type="checkbox" checked>自动吸附</label></div><div id="sceneWrap"><canvas id="packingCanvas" tabindex="0" aria-label="柜内手动调整工作台"></canvas><div id="sceneLabels"></div><div id="dragFeedback" role="status">左键拖货，右键转视角，滚轮缩放。已保存组合整组落柜底。</div></div><p id="layoutWarnings" class="learning-help"></p></section>
<aside class="edit-sidebar"><h3>选中货物</h3><p id="editSelected">点击柜内模型或左侧列表</p><div class="learning-form"><label class="full">目标集装箱<select id="targetContainer"></select></label><label>长向 X / mm<input id="editX" type="number" min="0" step="10"></label><label>宽向 Y / mm<input id="editY" type="number" min="0" step="10"></label><label>离地 Z / mm<input id="editZ" type="number" min="0" step="10"></label><div class="full learning-actions"><button class="btn primary sm" id="applyLayoutPosition">应用位置 / 换柜</button><button class="btn sm" id="floorLayout">放到柜底</button></div></div><div class="learning-actions edit-buttons"><button class="btn sm" data-rotate-layout="z">水平转90°</button><button class="btn sm" data-rotate-layout="x">前后翻90°</button><button class="btn sm" data-rotate-layout="y">左右翻90°</button><button class="btn sm" id="lockLayout">锁定位置</button><button class="btn sm" id="holdLayout">暂存为未装入</button></div><p class="learning-help">组合只整体水平转向，组内修改请回叠箱页。锁定上箱时会一起锁定必要支撑箱。每次操作都检查碰撞、悬空、承重和组合独立占地。</p><p id="editStatus" role="status" class="learning-status"></p></aside></main>
<script src="../js/vendor/three.min.js"></script><script src="../js/vendor/OrbitControls.js"></script><script src="renderer.js?v=3.3.0"></script><script src="transport.js?v=3.3.0"></script>
<script src="core.js?v=3.3.0"></script><script src="stacking.js?v=3.3.0"></script><script src="layout.js?v=3.3.0"></script><script src="experience.js?v=3.3.0"></script><script src="bridge.js?v=3.3.0"></script><script src="learning-client.js?v=3.3.0"></script><script src="learning-ui.js?v=3.3.0"></script><script src="scene-math.js?v=3.3.0"></script><script src="scene3d.js?v=3.3.0"></script><script src="packing-scene.js?v=3.3.0"></script><script src="edit-app.js?v=3.3.0"></script></body></html>
