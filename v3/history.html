<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUPER U · 历史与学习</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="learning.css?v=3.2.0"></head><body class="learning-page">
<header class="learning-header"><strong>SUPER U · 历史与学习</strong><span id="historyStatus" class="learning-status"></span><div class="learning-actions"><button class="btn" id="refreshHistory">刷新</button><button class="btn" id="syncNow">同步当前项目</button><a class="btn primary" href="./">去排柜</a></div></header>
<main class="learning-content"><div class="learning-note">正常拖动、旋转和换柜不需要选理由。确认最终方案后积累经验，相似组合会按当前规则重新检查。</div>
<nav class="learning-tabs"><button class="active" data-tab="projects">项目方案</button><button data-tab="cases">确认历史</button><button data-tab="policies">学习管理</button><button data-tab="connection">连接设置</button></nav>
<section id="tab-projects" class="learning-tab"><div class="learning-toolbar"><h2>项目方案</h2><button class="btn" id="editContext">关联 ERP 项目 / 发货批次</button><button class="btn primary" id="newProject">新建方案</button></div><div id="projectsList"></div></section>
<section id="tab-cases" class="learning-tab" hidden><div class="learning-toolbar"><h2>不可覆盖的确认版本</h2></div><div id="casesList"></div><div class="learning-export learning-actions"><button class="btn" id="exportLearning">导出经验归档</button><label class="btn">导入经验归档<input type="file" id="importLearning" accept=".json" hidden></label><span class="learning-help">归档包含文字与布局，照片不打包。导入历史只用于案例与模板。</span></div></section>
<section id="tab-policies" class="learning-tab" hidden><div class="learning-toolbar"><h2>候选、发布与回退</h2><button class="btn primary" id="analyseLearning">分析历史并生成候选</button></div><div id="policiesList"></div></section>
<section id="tab-connection" class="learning-tab" hidden><article class="learning-card"><h3>本机试用与公司共享服务</h3><p>GitHub Pages 可直接试用本机学习。多人共享、ERP 权限及服务器保存，需要连接已部署的排柜服务。</p><div class="learning-form"><label class="full">服务 API 地址<input id="serviceUrl" placeholder="https://work.example.com/api/load-planner" autocomplete="url"></label><label class="full">ERP 登录凭证<input id="serviceToken" type="password" autocomplete="off" placeholder="由 ERP 登录入口传递，或测试时填写临时凭证"></label><div class="full learning-actions"><button class="btn primary" id="connectService">连接共享服务</button><button class="btn" id="useLocalMode">使用本机试用</button></div></div><p>凭证仅保留在当前标签页会话中，不放入网址或经验归档。本机试用中的管理操作只影响当前浏览器。</p></article></section>
</main>
<script src="transport.js?v=3.2.0"></script>
<script src="core.js?v=3.2.0"></script><script src="stacking.js?v=3.2.0"></script><script src="layout.js?v=3.2.0"></script><script src="experience.js?v=3.2.0"></script><script src="bridge.js?v=3.2.0"></script><script src="learning-client.js?v=3.2.0"></script><script src="learning-ui.js?v=3.2.0"></script><script>PlannerLearningUI.historyPage().catch(e=>PlannerLearningUI.toast(e.message));</script></body></html>
